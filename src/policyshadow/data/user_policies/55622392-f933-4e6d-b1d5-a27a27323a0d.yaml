apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-team-label-live
spec:
  background: true
  rules:
    - name: require-team-label-live
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        message: Pods must declare a team label.
        pattern:
          metadata:
            labels:
              team: "?*"
